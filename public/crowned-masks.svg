<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 3-point sharp crown on top -->
  <path d="M18 38 L18 22 L38 32 L64 8 L90 32 L110 22 L110 38 Z" fill="#f59e0b"/>

  <!-- Comedy mask (left, blue) -->
  <g transform="translate(8, 42)">
    <ellipse cx="30" cy="32" rx="26" ry="28" fill="#3b82f6"/>
    <!-- Happy eyes -->
    <ellipse cx="20" cy="26" rx="5" ry="7" fill="#1e293b"/>
    <ellipse cx="40" cy="26" rx="5" ry="7" fill="#1e293b"/>
    <!-- Big smile -->
    <path d="M14 40 Q30 54 46 40" stroke="#1e293b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Raised eyebrows -->
    <path d="M12 18 Q20 12 28 18" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M32 18 Q40 12 48 18" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Tragedy mask (right, amber/gold) -->
  <g transform="translate(54, 50)">
    <ellipse cx="30" cy="30" rx="26" ry="28" fill="#f59e0b"/>
    <!-- Sad eyes -->
    <ellipse cx="20" cy="24" rx="5" ry="7" fill="#1e293b"/>
    <ellipse cx="40" cy="24" rx="5" ry="7" fill="#1e293b"/>
    <!-- Frown -->
    <path d="M14 44 Q30 34 46 44" stroke="#1e293b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Sad eyebrows -->
    <path d="M12 16 Q20 20 28 16" stroke="#d97706" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M32 16 Q40 20 48 16" stroke="#d97706" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Red ribbons -->
  <path d="M56 48 Q64 40 72 48" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M52 54 L48 68" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M76 54 L80 68" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
